<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 
      - /embed/dQw4w9WgXcQ: Uses the correct embedding path.
      - autoplay=1: Tells the video to start automatically.
      - mute=1: Most modern browsers block autoplay unless the video is muted.
    -->
    <iframe 
        src="https://youtube.com" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
    </iframe>

</body>
</html>
